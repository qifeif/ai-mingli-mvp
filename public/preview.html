<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心易 · 暗色液态玻璃首页预览</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --serif: "Instrument Serif", "Noto Serif SC", "Songti SC", serif;
    --sans: "Geist", -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }

  .page {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    background: #000;
  }

  .bg-video {
    position: absolute;
    left: 50%;
    top: 74%;
    z-index: 0;
    width: min(640px, 54vw);
    height: min(400px, 34vw);
    object-fit: cover;
    object-position: center 56%;
    opacity: 0;
    filter: brightness(.96) contrast(1.08);
    transform: translate(-50%, -50%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, #000 48%, rgba(0,0,0,.58) 67%, transparent 84%);
    mask-image: radial-gradient(ellipse at center, #000 0%, #000 48%, rgba(0,0,0,.58) 67%, transparent 84%);
  }

  .shade,
  .cinema {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .shade { background: rgba(0, 0, 0, .18); }
  .cinema {
    background:
      radial-gradient(ellipse at 50% 64%, rgba(255,255,255,.08), transparent 29%),
      radial-gradient(circle at 50% 78%, rgba(166,64,47,.12), transparent 20%),
      linear-gradient(180deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.58) 35%, rgba(0,0,0,.18) 60%, rgba(0,0,0,.84) 100%);
  }

  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    overflow: hidden;
    position: relative;
  }
  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(
      180deg,
      rgba(255,255,255,.45) 0%,
      rgba(255,255,255,.15) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,.15) 80%,
      rgba(255,255,255,.45) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .shell {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .nav-wrap {
    position: relative;
    z-index: 20;
    padding: 24px;
  }
  .nav {
    max-width: 1040px;
    margin: 0 auto;
    border-radius: 999px;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .brand-group,
  .brand,
  .nav-links,
  .nav-actions {
    display: flex;
    align-items: center;
  }
  .brand-group { gap: 34px; min-width: 0; }
  .brand { gap: 10px; font-weight: 700; white-space: nowrap; }
  .seal {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: linear-gradient(145deg, #b84a37, #80291d);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.32), 0 10px 22px -14px rgba(166,64,47,.9);
    color: #fff1e7;
    font-family: "Noto Serif SC", serif;
    font-weight: 900;
    font-size: 16px;
  }
  .brand span:last-child {
    font-family: "Noto Serif SC", serif;
    font-size: 18px;
    letter-spacing: 4px;
  }
  .nav-links { gap: 28px; }
  .nav-links a,
  .plain-btn {
    color: rgba(255,255,255,.8);
    font-size: 14px;
    font-weight: 600;
    transition: color .18s ease;
  }
  .nav-links a:hover,
  .plain-btn:hover { color: #fff; }
  .nav-actions { gap: 14px; }
  .plain-btn { border: 0; background: transparent; cursor: pointer; }
  .glass-btn {
    border: 0;
    border-radius: 999px;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 24px;
  }

  .hero {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
    transform: translateY(-12%);
  }
  .hero::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 44%;
    z-index: -1;
    width: min(760px, 92vw);
    height: min(360px, 44vh);
    background: radial-gradient(ellipse at center, rgba(0,0,0,.74) 0%, rgba(0,0,0,.42) 48%, rgba(0,0,0,0) 76%);
    filter: blur(14px);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .kicker {
    margin-bottom: 20px;
    color: rgba(255,255,255,.64);
    font-size: 13px;
    letter-spacing: 8px;
    text-indent: 8px;
  }
  h1 {
    margin: 0 0 24px;
    font-family: var(--serif);
    font-size: clamp(64px, 9vw, 112px);
    font-weight: 500;
    line-height: .94;
    letter-spacing: 12px;
    text-indent: 12px;
    white-space: nowrap;
    text-shadow: 0 18px 60px rgba(0,0,0,.62);
  }
  .lead {
    max-width: 720px;
    margin: 0 auto 28px;
    color: rgba(255,255,255,.86);
    font-family: "Noto Serif SC", serif;
    font-size: clamp(17px, 2.1vw, 22px);
    font-weight: 600;
    line-height: 1.9;
    text-shadow: 0 10px 30px rgba(0,0,0,.72);
  }
  .panel {
    width: min(100%, 600px);
    display: grid;
    gap: 16px;
  }
  .askbar {
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 999px;
    padding: 8px 8px 8px 24px;
  }
  .askbar input {
    min-width: 0;
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-size: 16px;
  }
  .askbar input::placeholder { color: rgba(255,255,255,.42); }
  .round-submit {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: #fff;
    color: #070707;
    cursor: pointer;
  }
  .subtitle {
    margin: 0;
    padding: 0 18px;
    color: #fff;
    font-size: 14px;
    line-height: 1.85;
  }
  .hero-actions {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    min-height: 48px;
    padding: 0 34px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .cta:hover { background: rgba(255,255,255,.05); transform: translateY(-1px); }
  .cta-primary {
    background: rgba(255,255,255,.94);
    color: #0a0a0a;
  }
  .cta-primary:hover { background: #fff; color: #000; }

  .social {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 0 24px 48px;
  }
  .icon-btn {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: rgba(255,255,255,.82);
    transition: color .18s ease, background .18s ease;
  }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,.05); }
  .icon-btn svg { width: 20px; height: 20px; }

  @media (max-width: 760px) {
    body { overflow-y: auto; }
    .bg-video {
      top: 76%;
      width: 92vw;
      height: 58vw;
      object-position: center 58%;
    }
    .nav-wrap { padding: 24px 16px; }
    .nav { padding: 12px 18px; }
    .nav-links { display: none; }
    .brand-group { gap: 16px; }
    .plain-btn { display: none; }
    .hero {
      transform: translateY(-6%);
      padding-top: 38px;
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 5px;
      text-indent: 5px;
    }
    h1 {
      font-size: clamp(54px, 18vw, 72px);
      letter-spacing: 8px;
      text-indent: 8px;
    }
    .lead { font-size: 17px; }
    .subtitle { font-size: 13px; }
    .social { padding-bottom: 34px; }
  }
</style>
</head>
<body>
  <main class="page">
    <video
      id="hero-video"
      class="bg-video"
      src="/xinyi-taiji-bg.mp4"
      muted
      autoplay
      playsinline
      preload="auto"
    ></video>
    <div class="shade"></div>
    <div class="cinema"></div>

    <div class="shell">
      <header class="nav-wrap">
        <nav class="nav liquid-glass" aria-label="主导航">
          <div class="brand-group">
            <a class="brand" href="/">
              <span class="seal">易</span>
              <span>心易</span>
            </a>
            <div class="nav-links" aria-label="页面入口">
              <a href="/app">天命</a>
              <a href="/diyun">地运</a>
              <a href="/renjiandao">人间道</a>
              <a href="/#pricing">定价</a>
            </div>
          </div>
          <div class="nav-actions">
            <button class="plain-btn" type="button">EN</button>
            <a class="glass-btn liquid-glass" href="/app">开始</a>
          </div>
        </nav>
      </header>

      <section class="hero" aria-label="首页预览">
        <div class="kicker">天命 · 地运 · 人间道</div>
        <h1>心易</h1>
        <p class="lead">把纠结说给它听，它陪你把选择想清楚。</p>

        <div class="panel">
          <form class="askbar liquid-glass" action="/app">
            <input aria-label="想问的事" placeholder="输入你正在纠结的选择" />
            <button class="round-submit" aria-label="进入天命" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>
              </svg>
            </button>
          </form>

          <p class="subtitle">命盘见性格倾向与能量节奏，是依据，不是判决。天命看势，地运调场，人间道问时机。</p>

          <div class="hero-actions">
            <a class="cta cta-primary" href="/app">开始排盘</a>
            <a class="cta liquid-glass" href="/renjiandao">问一卦</a>
          </div>
        </div>
      </section>

      <footer class="social" aria-label="三道入口">
        <a class="icon-btn liquid-glass" href="/app" aria-label="天命">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle><path d="M12 3v18M3 12h18"></path>
          </svg>
        </a>
        <a class="icon-btn liquid-glass" href="/diyun" aria-label="地运">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11 12 3l9 8"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path>
          </svg>
        </a>
        <a class="icon-btn liquid-glass" href="/renjiandao" aria-label="人间道">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 7h8"></path><path d="M6 12h12"></path><path d="M8 17h8"></path>
          </svg>
        </a>
      </footer>
    </div>
  </main>

  <script>
    const video = document.getElementById('hero-video');
    let frameId = null;
    let opacity = 0;
    let fadingOut = false;

    function fadeTo(target, duration = 500) {
      if (frameId !== null) cancelAnimationFrame(frameId);

      const startOpacity = opacity;
      const delta = target - startOpacity;
      const startTime = performance.now();

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        opacity = startOpacity + delta * progress;
        video.style.opacity = String(opacity);

        if (progress < 1) {
          frameId = requestAnimationFrame(animate);
          return;
        }

        opacity = target;
        video.style.opacity = String(target);
        frameId = null;
      }

      frameId = requestAnimationFrame(animate);
    }

    function fadeIn() {
      fadingOut = false;
      fadeTo(1);
    }

    video.addEventListener('loadeddata', fadeIn);
    video.addEventListener('timeupdate', () => {
      if (!Number.isFinite(video.duration) || fadingOut) return;
      if (video.duration - video.currentTime <= 0.55) {
        fadingOut = true;
        fadeTo(0);
      }
    });
    video.addEventListener('ended', () => {
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = null;
      opacity = 0;
      video.style.opacity = '0';

      window.setTimeout(() => {
        video.currentTime = 0;
        const promise = video.play();
        fadingOut = false;
        fadeTo(1);
        if (promise) promise.catch(() => {});
      }, 100);
    });

    if (video.readyState >= 2) fadeIn();
  </script>
</body>
</html>
