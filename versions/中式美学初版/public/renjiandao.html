<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心易 · 人间道 六爻卦象</title>
<link rel="stylesheet" href="/theme.css" />
<style>
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:760px; margin:0 auto; padding:40px 24px 96px; }

  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:34px; }
  .top .logo { font-family:"Songti SC","Noto Serif SC",serif; font-size:20px; letter-spacing:4px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .top .nav { display:flex; gap:18px; font-size:14px; color:var(--muted); align-items:center; }
  .top .nav a:hover { color:var(--ink); }
  .langtog { border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--muted);
    cursor:pointer; background:var(--card); letter-spacing:1px; }
  .langtog:hover { color:var(--ink); border-color:var(--accent-2); }

  header.hero { text-align:center; margin-bottom:36px; }
  .badge { display:inline-flex; align-items:center; gap:7px; font-size:12px; letter-spacing:2px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:6px 14px; margin-bottom:20px; background:var(--card); }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 10px var(--glow); }
  h1 { font-family:"Songti SC","Noto Serif SC",serif; font-size:40px; font-weight:600; letter-spacing:8px; margin:0 0 12px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:none; }
  .sub { color:var(--muted); font-size:15px; letter-spacing:1px; }

  form { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px;
    box-shadow:var(--shadow); }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:8px; letter-spacing:1px; }
  input,textarea { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:11px;
    background:var(--bg-2); color:var(--ink); font-family:inherit; font-size:15px; transition:border-color .2s,box-shadow .2s; }
  textarea { resize:vertical; min-height:74px; line-height:1.7; }
  input:focus,textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(42,38,32,.14); }
  .ritual-note { font-size:12px; color:var(--faint); margin:10px 2px 18px; line-height:1.7; }

  button.go { width:100%; margin-top:8px; padding:15px; border:none; border-radius:12px; background:var(--grad);
    color:#fff; font-family:inherit; font-size:16px; font-weight:600; letter-spacing:4px; cursor:pointer;
    box-shadow:0 10px 34px -10px var(--glow); transition:filter .2s,transform .1s,opacity .2s; }
  button.go:hover:not(:disabled){ filter:brightness(1.08); } button.go:active:not(:disabled){ transform:translateY(1px); }
  button.go:disabled { opacity:.55; cursor:default; }
  button.ghost { background:transparent; color:var(--accent-2); border:1px solid var(--line); box-shadow:none; }
  button.ghost:hover:not(:disabled){ border-color:var(--accent-2); filter:none; }

  #result { margin-top:30px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px;
    box-shadow:var(--shadow); margin-bottom:20px; }
  .panel .t { font-size:12px; color:var(--accent-2); letter-spacing:2px; margin-bottom:16px; }

  /* 卦象区 */
  .castwrap { display:flex; gap:28px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .hexcol { text-align:center; }
  .hexcol .gname { font-family:"Songti SC",serif; font-size:24px; letter-spacing:2px; margin-bottom:4px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .hexcol .gtri { font-size:11px; color:var(--faint); letter-spacing:1px; margin-bottom:14px; }
  .hex { display:flex; flex-direction:column-reverse; gap:9px; } /* column-reverse:数组0=初爻在底 */
  .yao { position:relative; height:15px; display:flex; gap:11px; justify-content:center; opacity:0; transform:translateY(6px);
    animation:rise .5s ease forwards; }
  .yao .bar { width:48px; height:100%; border-radius:3px; background:linear-gradient(90deg,#2A2620,#46403A); box-shadow:0 1px 3px rgba(42,38,32,.2); }
  .yao.yin .bar { width:20px; }
  .yao.moving .bar { background:linear-gradient(90deg,#B23A2E,#C8553D); box-shadow:0 1px 6px var(--gold-glow); }
  .yao .mk { position:absolute; right:-22px; top:-3px; font-size:13px; color:var(--gold); }
  @keyframes rise { to { opacity:1; transform:translateY(0); } }
  .arrow { font-size:24px; color:var(--faint); }
  .castmeta { margin-top:18px; text-align:center; font-size:13px; color:var(--muted); line-height:1.9; }
  .castmeta b { color:var(--ink); } .castmeta .gold { color:var(--gold); }
  .rule { margin-top:12px; font-size:12px; color:var(--faint); text-align:center; }

  .reading { white-space:pre-wrap; font-size:15px; line-height:2; color:var(--ink); }
  .err { color:var(--cinnabar); font-size:14px; }
  .loading { text-align:center; color:var(--muted); padding:46px; letter-spacing:3px; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  .hint-foot { text-align:center; color:var(--faint); font-size:12px; margin-top:28px; letter-spacing:.5px; }
  @media (max-width:520px){ h1{font-size:32px; letter-spacing:5px;} .wrap{padding:32px 16px 72px;} }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <a href="/" class="logo">心易</a>
    <div class="nav">
      <a href="/app" data-i18n="nav.tianming">天命</a>
      <a href="/diyun" data-i18n="nav.diyun">地运</a>
      <a href="/#pricing" data-i18n="nav.pricing">定价</a>
      <span class="langtog" id="langtog">EN</span>
    </div>
  </div>

  <header class="hero">
    <div class="badge"><span class="dot"></span><span data-i18n="hero.badge">人间道 · 周易六爻 · 卦图象解</span></div>
    <h1 data-i18n="hero.title">人 间 道</h1>
    <div class="sub" data-i18n="hero.sub">心中默念所问之事，摇一卦 —— 观象悟辞，看此刻处境与时机</div>
  </header>

  <form id="f">
    <label data-i18n="form.qlabel">你要问的事(一事一问，越具体越好)</label>
    <textarea name="question" data-i18n-ph="form.qph" placeholder="例：手上这个新机会，现在该接还是再等等？"></textarea>
    <div class="ritual-note" data-i18n="form.ritual">起卦讲究心诚则灵：请先把问题在心里想清楚、默念一遍，再摇卦。一事一卦，不重复摇同一件事。</div>
    <button type="submit" class="go" id="btn" data-i18n="form.cast">摇 卦</button>
  </form>

  <div id="result"></div>
  <div class="hint-foot" data-i18n="foot">六爻所示为处境之象与时机参考，给的是视角不是定数，决定权始终在你手里。</div>
</div>

<script>
const I18N = {
  zh: {
    'nav.tianming':'天命','nav.diyun':'地运','nav.pricing':'定价',
    'hero.badge':'人间道 · 周易六爻 · 卦图象解','hero.title':'人 间 道',
    'hero.sub':'心中默念所问之事，摇一卦 —— 观象悟辞，看此刻处境与时机',
    'form.qlabel':'你要问的事(一事一问，越具体越好)',
    'form.qph':'例：手上这个新机会，现在该接还是再等等？',
    'form.ritual':'起卦讲究心诚则灵：请先把问题在心里想清楚、默念一遍，再摇卦。一事一卦，不重复摇同一件事。',
    'form.cast':'摇 卦','foot':'六爻所示为处境之象与时机参考，给的是视角不是定数，决定权始终在你手里。',
    'casting':'铜钱落定中…','bengua':'本卦','biangua':'变卦','nobian':'六爻不动·无变卦',
    'moving':'动爻','none':'无','interpret':'请它为你解读','reading_load':'正在观象悟辞…',
    'recast':'重新摇一卦','need_q':'先写下你要问的事',
  },
  en: {
    'nav.tianming':'Tian Ming','nav.diyun':'Di Yun','nav.pricing':'Pricing',
    'hero.badge':'Ren Jian Dao · I Ching Six Lines · Image Reading','hero.title':'R E N　J I A N　D A O',
    'hero.sub':'Hold your question in mind, then cast — read the image, sense the moment',
    'form.qlabel':'What do you want to ask? (one question at a time, be specific)',
    'form.qph':'e.g. This new opportunity — take it now or wait?',
    'form.ritual':'Sincerity matters: settle your question in mind and recite it once before casting. One matter, one cast — don\'t re-cast the same question.',
    'form.cast':'C A S T','foot':'The six lines show the image of your situation and its timing — a perspective, not a verdict. The decision stays with you.',
    'casting':'The coins are settling…','bengua':'Primary','biangua':'Changing','nobian':'No moving lines · no changing hexagram',
    'moving':'Moving lines','none':'none','interpret':'Ask for a reading','reading_load':'Reading the image…',
    'recast':'Cast again','need_q':'Write your question first',
  },
};
let LANG = localStorage.getItem('lang') || 'zh';
function t(k){ return (I18N[LANG]&&I18N[LANG][k]) || (I18N.zh[k]||k); }
function applyI18n(){
  document.documentElement.lang = LANG==='en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.getElementById('langtog').textContent = LANG==='en' ? '中' : 'EN';
}
document.getElementById('langtog').addEventListener('click', ()=>{
  LANG = LANG==='en' ? 'zh' : 'en'; localStorage.setItem('lang', LANG); applyI18n();
});
applyI18n();

const f = document.getElementById('f');
const btn = document.getElementById('btn');
const result = document.getElementById('result');
let lastCast = null, lastQuestion = '';

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = new FormData(f).get('question').trim();
  if (!q) { result.innerHTML = `<div class="panel"><span class="err">${esc(t('need_q'))}</span></div>`; return; }
  lastQuestion = q;
  btn.disabled = true; btn.textContent = t('casting');
  result.innerHTML = `<div class="loading">${esc(t('casting'))}</div>`;
  try {
    const res = await fetch('/api/liuyao', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'cast failed');
    lastCast = data.cast;
    result.innerHTML = renderCast(data.cast);
    document.getElementById('interpretBtn')?.addEventListener('click', interpret);
  } catch (err) {
    result.innerHTML = `<div class="panel"><span class="err">${esc(err.message)}</span></div>`;
  } finally {
    btn.disabled = false; btn.textContent = t('form.cast');
  }
});

function hexColumn(hex, movingSet, label){
  // hex.bits: [初..上] 1=阳0=阴;column-reverse 让初爻在底
  const yaos = hex.bits.map((b,i)=>{
    const moving = movingSet.has(i+1);
    const mk = moving ? (b? '○':'×') : '';
    return `<div class="yao ${b?'yang':'yin'} ${moving?'moving':''}" style="animation-delay:${i*0.12}s">
      <span class="bar"></span>${b?'':'<span class="bar"></span>'}${mk?`<span class="mk">${mk}</span>`:''}</div>`;
  }).join('');
  return `<div class="hexcol"><div class="gname">${esc(hex.name)}</div>
    <div class="gtri">${esc(hex.symbol)}　上${esc(hex.upper)}下${esc(hex.lower)}</div>
    <div class="hex">${yaos}</div><div class="rule" style="margin-top:10px">${esc(label)}</div></div>`;
}

function renderCast(c){
  const moving = new Set(c.动爻||[]);
  const ben = hexColumn(c.本卦, moving, t('bengua'));
  const bian = c.变卦 ? hexColumn(c.变卦, new Set(), t('biangua')) : '';
  const arrow = c.变卦 ? `<div class="arrow">→</div>` : '';
  const movTxt = (c.动爻&&c.动爻.length) ? c.动爻.map(p=>`第${p}爻`).join('、') : t('none');
  return `
  <div class="panel">
    <div class="t" data-static>${esc(t('hero.badge'))}</div>
    <div class="castwrap">${ben}${arrow}${bian}</div>
    <div class="castmeta">
      <b>${esc(c.本卦.name)}</b>${c.变卦?` <span class="gold">→</span> <b>${esc(c.变卦.name)}</b>`:` · ${esc(t('nobian'))}`}<br>
      ${esc(t('moving'))}：<span class="gold">${esc(movTxt)}</span>
    </div>
    <div class="rule">${esc(c.取辞规则||'')}</div>
    <div style="display:flex; gap:12px; margin-top:22px">
      <button class="go" id="interpretBtn" style="flex:2">${esc(t('interpret'))}</button>
      <button class="go ghost" style="flex:1" onclick="document.getElementById('f').requestSubmit()">${esc(t('recast'))}</button>
    </div>
  </div>`;
}

async function interpret(){
  const ibtn = document.getElementById('interpretBtn');
  if (ibtn) { ibtn.disabled = true; ibtn.textContent = t('reading_load'); }
  const block = document.createElement('div');
  block.innerHTML = `<div class="loading">${esc(t('reading_load'))}</div>`;
  result.appendChild(block);
  try {
    const res = await fetch('/api/renjiandao', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question: lastQuestion, cast: lastCast, lang: LANG }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'reading failed');
    block.innerHTML = `<div class="panel"><div class="t">${esc(t('hero.title'))}</div><div class="reading">${esc(data.text||'')}</div></div>`;
  } catch (err) {
    block.innerHTML = `<div class="panel"><span class="err">${esc(err.message)}</span></div>`;
  } finally {
    if (ibtn) { ibtn.disabled = false; ibtn.textContent = t('interpret'); }
  }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
</script>
<script src="/ink.js" defer></script>
</body>
</html>
