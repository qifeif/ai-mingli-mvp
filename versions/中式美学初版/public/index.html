<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心易 · 天命 八字解读</title>
<link rel="stylesheet" href="/theme.css" />
<style>
  .wrap { max-width: 720px; margin: 0 auto; padding: 80px 24px 96px; position: relative; }

  header { text-align: center; margin-bottom: 14px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12px; letter-spacing: 2px;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; margin-bottom: 28px; background: rgba(42,38,32,.03);
    backdrop-filter: blur(6px);
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2);
    box-shadow: 0 0 10px var(--glow); }
  h1 {
    font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    font-size: 58px; font-weight: 600; letter-spacing: 10px; margin: 0 0 14px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 4px 30px rgba(42,38,32,.35));
  }
  .sub { color: var(--muted); font-size: 16px; letter-spacing: 1px; }
  .sub b { color: var(--ink); font-weight: 500; }
  .duo {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    margin: 22px 0 44px; color: var(--faint); font-size: 13px; letter-spacing: 2px;
  }
  .duo span { color: var(--muted); }
  .duo i { width: 4px; height: 4px; border-radius: 50%; background: var(--faint); font-style: normal; }

  form {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px -30px rgba(40,40,60,.12), inset 0 1px 0 rgba(42,38,32,.04);
  }
  .row { display: flex; gap: 16px; margin-bottom: 20px; }
  .row > div { flex: 1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; }
  input, select, textarea {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--bg-2); color: var(--ink); font-family: inherit; font-size: 15px;
    transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  textarea { resize: vertical; min-height: 92px; line-height: 1.7; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(42,38,32,.18);
  }
  select option { background: #fff; }
  button {
    width: 100%; margin-top: 6px; padding: 15px; border: none; border-radius: 12px;
    background: var(--grad); background-size: 160% 160%; color:#fff; font-family: inherit;
    font-size: 16px; font-weight: 600; letter-spacing: 4px; cursor: pointer;
    transition: filter .2s, transform .1s, opacity .2s;
    box-shadow: 0 10px 34px -10px var(--glow);
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; }

  #result { margin-top: 34px; }
  .reading {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 36px; white-space: pre-wrap; font-size: 16px; line-height: 2;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px -30px rgba(40,40,60,.12);
  }
  .meta {
    font-size: 12px; color: var(--accent-2); margin-bottom: 20px; letter-spacing: .5px;
    padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }

  /* ===== 命盘面板 ===== */
  .chart-panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 30px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px -30px rgba(40,40,60,.12); margin-bottom: 22px;
  }
  .cp-cap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 6px; flex-wrap: wrap; }
  .cp-cap h3 { font-family: "Songti SC","Noto Serif SC",serif; font-size: 20px; letter-spacing: 4px; margin: 0;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .cp-cap .corr { font-size: 11px; color: var(--faint); letter-spacing: .3px; }
  .cp-base { font-size: 12px; color: var(--faint); margin-bottom: 22px; letter-spacing: .3px; line-height: 1.6; }
  .cp-sec { margin-top: 22px; }
  .cp-sec > .t { font-size: 12px; color: var(--accent-2); letter-spacing: 2px; margin-bottom: 12px; }

  /* 四柱盘 */
  .pillars { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
  .pillar { text-align: center; border: 1px solid var(--line); border-radius: 13px; padding: 14px 6px;
    background: var(--bg-2); }
  .pillar.day { border-color: rgba(110,103,91,.55); box-shadow: 0 0 0 1px rgba(110,103,91,.25), 0 0 24px -6px var(--glow); }
  .pillar .pos { font-size: 11px; color: var(--faint); letter-spacing: 1px; margin-bottom: 8px; }
  .pillar .gz { font-family: "Songti SC","Noto Serif SC",serif; font-size: 30px; line-height: 1.25; color: var(--ink); }
  .pillar.day .gz { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  /* 日主条 */
  .daymain { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line);
    border-radius: 13px; padding: 14px 16px; background: var(--bg-2); }
  .daymain .big { font-family: "Songti SC",serif; font-size: 32px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .daymain .dm-txt { font-size: 13px; color: var(--muted); }
  .daymain .dm-txt b { color: var(--ink); font-weight: 600; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--accent-2); margin-left: 6px; }

  /* 五行条 */
  .wx-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .wx-row .wx-name { width: 20px; color: var(--muted); text-align: center; }
  .wx-bar { flex: 1; height: 9px; border-radius: 999px; background: var(--bg-2); overflow: hidden; }
  .wx-bar > i { display: block; height: 100%; border-radius: 999px; background: var(--grad); }
  .wx-row .wx-n { width: 18px; text-align: right; color: var(--faint); font-size: 12px; }
  .wx-note { font-size: 12px; color: var(--faint); margin-top: 8px; }
  .wx-note b { color: var(--accent-2); }

  /* 十神 */
  .ss-list { display: grid; gap: 8px; }
  .ss-item { display: flex; gap: 12px; align-items: baseline; font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; }
  .ss-item:first-child { border-top: none; padding-top: 0; }
  .ss-item .ss-pos { color: var(--faint); width: 38px; flex: none; }
  .ss-item .ss-name { color: var(--accent-2); width: 44px; flex: none; }
  .ss-item .ss-hua { color: var(--muted); }

  /* 大运 */
  .dayun { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .dy { flex: none; min-width: 76px; text-align: center; border: 1px solid var(--line); border-radius: 11px;
    padding: 10px 8px; background: var(--bg-2); }
  .dy.cur { border-color: rgba(110,103,91,.55); box-shadow: 0 0 18px -6px var(--glow); }
  .dy .dy-gz { font-family: "Songti SC",serif; font-size: 18px; color: var(--ink); }
  .dy.cur .dy-gz { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .dy .dy-age { font-size: 10px; color: var(--faint); margin-top: 4px; }
  .ln-box, .dy-cur-box { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 11px;
    padding: 12px 14px; background: var(--bg-2); margin-top: 4px; }
  .ln-box b, .dy-cur-box b { color: var(--accent-2); }
  .crisis { border-color: rgba(110,103,91,.5); box-shadow: 0 0 0 1px rgba(110,103,91,.25), 0 24px 70px -30px rgba(40,40,60,.12); }
  .err { color: var(--cinnabar); font-size: 14px; }
  .hint { text-align: center; color: var(--faint); font-size: 12px; margin-top: 30px; letter-spacing: .5px; }
  .loading {
    text-align: center; color: var(--muted); padding: 48px; letter-spacing: 3px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  @media (max-width: 520px) {
    h1 { font-size: 44px; letter-spacing: 6px; }
    .wrap { padding: 56px 18px 72px; }
    .row { flex-direction: column; gap: 16px; }
    form, .reading { padding: 24px; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:14px;color:var(--muted)">
    <a href="/" style="font-family:'Songti SC',serif;font-size:18px;letter-spacing:3px;color:var(--accent-2);text-decoration:none">心易</a>
    <div style="display:flex;gap:16px;align-items:center">
      <a href="/app" style="color:var(--ink);text-decoration:none" data-i18n="nav.tianming">天命</a>
      <a href="/diyun" style="color:inherit;text-decoration:none" data-i18n="nav.diyun">地运</a>
      <a href="/renjiandao" style="color:inherit;text-decoration:none" data-i18n="nav.renjiandao">人间道</a>
      <a href="/#pricing" style="color:inherit;text-decoration:none" data-i18n="nav.pricing">定价</a>
      <span id="langtog" style="border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;letter-spacing:1px">EN</span>
    </div>
  </div>
  <header>
    <div class="badge"><span class="dot"></span><span data-i18n="hero.badge">天命 · 子平八字 · 真太阳时</span></div>
    <h1>心 易</h1>
    <div class="sub"><b data-i18n="hero.motto">由易入理,三才合一</b>　<span data-i18n="hero.sub">把纠结说给它听,它陪你把选择想清楚</span></div>
    <div class="duo"><span data-i18n="hero.east">东方命理</span><i></i><span data-i18n="hero.mid">天干地支　·　星盘塔罗</span><i></i><span data-i18n="hero.west">西方占术</span></div>
  </header>

  <form id="f">
    <div class="row">
      <div>
        <label data-i18n="f.gender">性别</label>
        <select name="gender"><option value="女" data-i18n="f.female">女</option><option value="男" data-i18n="f.male">男</option></select>
      </div>
      <div>
        <label data-i18n="f.place">出生地</label>
        <input name="place" value="杭州" data-i18n-ph="f.place_ph" placeholder="如 杭州" />
      </div>
    </div>
    <div class="row">
      <div>
        <label data-i18n="f.date">出生日期</label>
        <input type="date" name="date" value="1996-08-12" />
      </div>
      <div>
        <label data-i18n="f.time">出生时间</label>
        <input type="time" name="time" value="14:30" />
      </div>
    </div>
    <div style="margin-bottom:20px">
      <label data-i18n="f.q">此刻的纠结</label>
      <textarea name="question" data-i18n-ph="f.q_ph" placeholder="把你正在纠结的事说出来,越具体越好…">工作三年了很迷茫,要不要辞职去考研?</textarea>
    </div>
    <div class="row" style="align-items:flex-end">
      <div>
        <label data-i18n="f.style">解读风格</label>
        <select name="style">
          <option value="friend" data-i18n="f.friend">朋友版(更暖)</option>
          <option value="pro" data-i18n="f.pro">专业版(更克制)</option>
        </select>
      </div>
      <div style="flex:2"><button type="submit" id="btn" data-i18n="f.submit">观 象 入 元</button></div>
    </div>
  </form>

  <div id="result"></div>
  <div class="hint" data-i18n="f.disclaimer">AI 输出仅供参考与自我思考,不构成任何预测或建议 · 决定权永远在你</div>
</div>

<script>
const I18N = {
  zh: {
    'nav.tianming':'天命','nav.diyun':'地运','nav.renjiandao':'人间道','nav.pricing':'定价',
    'hero.badge':'天命 · 子平八字 · 真太阳时','hero.motto':'由易入理,三才合一','hero.sub':'把纠结说给它听,它陪你把选择想清楚',
    'hero.east':'东方命理','hero.mid':'天干地支　·　星盘塔罗','hero.west':'西方占术',
    'f.gender':'性别','f.female':'女','f.male':'男','f.place':'出生地','f.place_ph':'如 杭州',
    'f.date':'出生日期','f.time':'出生时间','f.q':'此刻的纠结','f.q_ph':'把你正在纠结的事说出来,越具体越好…',
    'f.style':'解读风格','f.friend':'朋友版(更暖)','f.pro':'专业版(更克制)','f.submit':'观 象 入 元',
    'f.disclaimer':'AI 输出仅供参考与自我思考,不构成任何预测或建议 · 决定权永远在你',
    'f.loading_btn':'解 读 中…','loading':'正在为你点亮命运星图…','err':'出错了：','unavail':'解读暂不可用：',
    'offline_note':'以上为离线排盘结果;配置 ANTHROPIC_API_KEY 后即可获得 AI 解读。','airead':'AI 深度解读','scene':'场景 · ',
    'sc.decision':'抉择','sc.emotion':'情感','sc.timing':'时机','sc.self':'自我认知',
  },
  en: {
    'nav.tianming':'Tian Ming','nav.diyun':'Di Yun','nav.renjiandao':'Ren Jian Dao','nav.pricing':'Pricing',
    'hero.badge':'Tian Ming · BaZi · True Solar Time','hero.motto':'By the Yi into insight · Three Powers as one','hero.sub':'Tell it what you\'re wrestling with — it helps you think the choice through',
    'hero.east':'Eastern','hero.mid':'BaZi · Astrology · Tarot','hero.west':'Western',
    'f.gender':'Gender','f.female':'Female','f.male':'Male','f.place':'Birthplace','f.place_ph':'e.g. Hangzhou',
    'f.date':'Birth date','f.time':'Birth time','f.q':'What\'s on your mind','f.q_ph':'Describe what you\'re wrestling with, the more specific the better…',
    'f.style':'Tone','f.friend':'Friend (warmer)','f.pro':'Pro (measured)','f.submit':'R E A D',
    'f.disclaimer':'AI output is for reflection only — not a prediction or directive · the decision is always yours',
    'f.loading_btn':'Reading…','loading':'Lighting up your chart…','err':'Error: ','unavail':'Reading unavailable: ',
    'offline_note':'Above is the offline chart; set ANTHROPIC_API_KEY to get the AI reading.','airead':'AI reading','scene':'Topic · ',
    'sc.decision':'Decision','sc.emotion':'Relationship','sc.timing':'Timing','sc.self':'Self',
  },
};
let LANG = localStorage.getItem('lang') || 'zh';
function t(k){ return (I18N[LANG]&&I18N[LANG][k]) || (I18N.zh[k]||k); }
function applyI18n(){
  document.documentElement.lang = LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.getElementById('langtog').textContent = LANG==='en'?'中':'EN';
}
document.getElementById('langtog').addEventListener('click', ()=>{ LANG = LANG==='en'?'zh':'en'; localStorage.setItem('lang',LANG); applyI18n(); });
applyI18n();

const f = document.getElementById('f');
const btn = document.getElementById('btn');
const result = document.getElementById('result');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  const payload = {
    gender: d.gender,
    place: d.place,
    datetime: `${d.date} ${d.time}`,
    question: d.question,
    style: d.style,
    lang: LANG,
  };
  btn.disabled = true; btn.textContent = t('f.loading_btn');
  result.innerHTML = `<div class="loading">${esc(t('loading'))}</div>`;
  try {
    const res = await fetch('/api/consult', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    // 解读接口不可用(如未配置 API Key)→ 降级到纯排盘,排盘照样可看
    if (!res.ok) {
      const chart = await fetchChartOnly(payload);
      if (chart) {
        result.innerHTML = renderChart(chart)
          + `<div class="reading"><span class="err">${esc(t('unavail'))}${esc(data.error || 'request failed')}</span>
             <div class="meta" style="margin:14px 0 0;border:none;padding:0">${esc(t('offline_note'))}</div></div>`;
        return;
      }
      throw new Error(data.error || '请求失败');
    }

    if (data.type === 'crisis') {
      // 危机短路:只给温柔陪伴,不展示命盘
      result.innerHTML = `<div class="reading crisis">${esc(data.text)}</div>`;
    } else {
      // 命盘面板(封装的排盘解读)+ AI 主解读
      result.innerHTML = renderChart(data.chart)
        + `<div class="reading"><div class="meta">${esc(t('scene'))}${esc(sceneLabel(data.scene))}　|　${esc(t('airead'))}</div>${esc(data.text)}</div>`;
    }
  } catch (err) {
    result.innerHTML = `<div class="reading"><span class="err">${esc(t('err'))}${esc(err.message)}</span></div>`;
  } finally {
    btn.disabled = false; btn.textContent = t('f.submit');
  }
});

async function fetchChartOnly(payload) {
  try {
    const r = await fetch('/api/chart', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    return r.ok ? d.chart : null;
  } catch { return null; }
}

function sceneLabel(s) { return t('sc.' + s) !== ('sc.' + s) ? t('sc.' + s) : s; }
const WX_KEYS = ['木', '火', '土', '金', '水'];

// 把结构化命盘渲染成可视面板(封装的「八字排盘解读」功能内容)
function renderChart(c) {
  const b = c.基本 || {};
  const dz = c.日主 || {};
  const wx = c.五行分布 || {};
  const maxWx = Math.max(1, ...WX_KEYS.map((k) => wx[k] || 0));

  const pillars = ['年', '月', '日', '时'].map((pos) => {
    const gz = (c.四柱 || {})[pos] || '';
    return `<div class="pillar${pos === '日' ? ' day' : ''}">
      <div class="pos">${pos}柱</div>
      <div class="gz">${esc(gz.charAt(0))}<br>${esc(gz.charAt(1))}</div></div>`;
  }).join('');

  const wxBars = WX_KEYS.map((k) => `
    <div class="wx-row"><span class="wx-name">${k}</span>
      <span class="wx-bar"><i style="width:${Math.round((wx[k] || 0) / maxWx * 100)}%"></i></span>
      <span class="wx-n">${wx[k] || 0}</span></div>`).join('');
  const lack = wx.缺 && wx.缺 !== '无' ? `缺 <b>${[].concat(wx.缺).join('')}</b>　` : '';
  const over = wx.过旺 && wx.过旺 !== '无' ? `过旺 <b>${[].concat(wx.过旺).join('')}</b>` : '';

  const ssList = (c.十神要点 || []).map((s) => `
    <div class="ss-item"><span class="ss-pos">${esc(s.位)}</span>
      <span class="ss-name">${esc(s.十神)}</span><span class="ss-hua">${esc(s.白话)}</span></div>`).join('');

  const dayun = (c.大运 || []).map((d) => {
    const cur = c.当前大运 && d.干支 === c.当前大运.干支;
    return `<div class="dy${cur ? ' cur' : ''}"><div class="dy-gz">${esc(d.干支)}</div>
      <div class="dy-age">${esc(d.起止岁 || d.起讫)}</div></div>`;
  }).join('');

  const curDy = c.当前大运 ? `<div class="dy-cur-box">当前大运 <b>${esc(c.当前大运.干支)}</b>（${esc(c.当前大运.主十神)}）— ${esc(c.当前大运.白话)}</div>` : '';
  const ln = c.今年流年 ? `<div class="ln-box">今年流年 <b>${esc(c.今年流年.干支)}</b>（${esc(c.今年流年.主十神)}）— ${esc(c.今年流年.白话)}</div>` : '';

  return `<div class="chart-panel">
    <div class="cp-cap"><h3>命 盘</h3><span class="corr">${b.已校正真太阳时 ? '✦ 已做真太阳时校正' : '· 未校正(建议补全出生地)'}</span></div>
    <div class="cp-base">${esc(b.性别 || '')}　${esc(b.公历生日 || '')}　${esc(b.出生地 || '')}<br>${esc(b.校正明细 || '')}</div>

    <div class="cp-sec"><div class="t">四柱</div><div class="pillars">${pillars}</div></div>

    <div class="cp-sec"><div class="t">日主</div>
      <div class="daymain"><span class="big">${esc(dz.天干 || '')}</span>
        <span class="dm-txt"><b>${esc(dz.五行 || '')}</b> 日主 · <b>${esc(dz.旺衰 || '')}</b>
          <span class="pill">${dz.得令 ? '得令' : '失令'}</span><br>${esc(dz.白话 || '')}</span></div></div>

    <div class="cp-sec"><div class="t">五行分布</div>${wxBars}
      ${(lack || over) ? `<div class="wx-note">${lack}${over}</div>` : ''}</div>

    ${ssList ? `<div class="cp-sec"><div class="t">十神要点</div><div class="ss-list">${ssList}</div></div>` : ''}

    ${dayun ? `<div class="cp-sec"><div class="t">大运</div><div class="dayun">${dayun}</div>${curDy}</div>` : ''}

    ${ln ? `<div class="cp-sec"><div class="t">流年</div>${ln}</div>` : ''}
  </div>`;
}

function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
</script>
<script src="/ink.js" defer></script>
</body>
</html>
